AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Varuna Scenario API and separate limited-coverage real-road photo evidence

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://main.d9r54jpiln4dg.amplifyapp.com
    AllowedValues:
      - https://main.d9r54jpiln4dg.amplifyapp.com
    Description: Existing main frontend origin, without a trailing slash
  AllowedPreviewOrigin:
    Type: String
    AllowedValues:
      - https://feature-delhi-hybrid-overview.d9r54jpiln4dg.amplifyapp.com
    Description: Delhi feature preview origin, without a trailing slash
  CognitoJwtIssuer:
    Type: String
    Description: Cognito user-pool issuer URL (https://cognito-idp.REGION.amazonaws.com/POOL_ID)
  CognitoJwtAudience:
    Type: String
    Description: Cognito app-client ID expected in signed-in access JWTs
  RoadAlertScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - DISABLED
      - ENABLED
    Description: Enable only after a reviewed manual ingestion and source-permission check

Resources:
  VarunaHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      FailOnWarnings: true
      Auth:
        Authorizers:
          CognitoAccessJwt:
            JwtConfiguration:
              issuer: !Ref CognitoJwtIssuer
              audience:
                - !Ref CognitoJwtAudience
            IdentitySource: $request.header.Authorization
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - !Ref AllowedPreviewOrigin
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 300

  VarunaPrivatePhotos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
              - !Ref AllowedPreviewOrigin
            AllowedMethods:
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - content-type
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          - Id: ExpireReviewPhotos
            Status: Enabled
            Prefix: review/
            ExpirationInDays: 7

  VarunaReports:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true

  VarunaRealRoadReports:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true

  VarunaRoadAlerts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 7
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true

  VarunaFixtureApi:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.varuna.api.lambda_handler
      Runtime: python3.12
      CodeUri: .lambda-package/
      MemorySize: 256
      Timeout: 10
      Description: Synthetic Scenario API and separate limited OSM photo evidence; no Live feed
      Environment:
        Variables:
          VARUNA_CORS_ORIGIN: !Ref AllowedOrigin
          VARUNA_CORS_PREVIEW_ORIGIN: !Ref AllowedPreviewOrigin
          VARUNA_REPORTS_TABLE: !Ref VarunaReports
          VARUNA_REAL_ROAD_REPORTS_TABLE: !Ref VarunaRealRoadReports
          VARUNA_MEDIA_BUCKET: !Ref VarunaPrivatePhotos
          VARUNA_ROAD_ALERTS_TABLE: !Ref VarunaRoadAlerts
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource: !GetAtt VarunaRoadAlerts.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource: !GetAtt VarunaReports.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource: !GetAtt VarunaRealRoadReports.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub ${VarunaPrivatePhotos.Arn}/uploads/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${VarunaPrivatePhotos.Arn}/review/*
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /{proxy+}
            Method: ANY
        ProtectedUploadRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v1/reports/upload-url
            Method: POST
            RouteSettings:
              ThrottlingBurstLimit: 2
              ThrottlingRateLimit: 0.5
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedReportCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v1/reports
            Method: POST
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedReportList:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v1/reports
            Method: GET
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedReportDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v1/reports/{id}
            Method: GET
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedReportReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v1/reports/{id}/review
            Method: PATCH
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedRealRoadUploadRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/real-road-reports/upload-url
            Method: POST
            RouteSettings:
              ThrottlingBurstLimit: 2
              ThrottlingRateLimit: 0.5
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedRealRoadCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/real-road-reports
            Method: POST
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedRealRoadList:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/real-road-reports
            Method: GET
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedRealRoadDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/real-road-reports/{id}
            Method: GET
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedRealRoadReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/real-road-reports/{id}/review
            Method: PATCH
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes:
                - openid
        ProtectedRoadAlertImport:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/road-alerts/import
            Method: POST
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes: [openid]
        ProtectedRoadAlertQueue:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/road-alerts/review
            Method: GET
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes: [openid]
        ProtectedRoadAlertDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/road-alerts/{id}
            Method: GET
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes: [openid]
        ProtectedRoadAlertReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref VarunaHttpApi
            Path: /v2/road-alerts/{id}/review
            Method: PATCH
            Auth:
              Authorizer: CognitoAccessJwt
              AuthorizationScopes: [openid]

  VarunaRoadAlertIngest:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.varuna.traffic_ingest.lambda_handler
      Runtime: python3.12
      CodeUri: .lambda-package/
      MemorySize: 256
      Timeout: 150
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          VARUNA_ROAD_ALERTS_TABLE: !Ref VarunaRoadAlerts
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt VarunaRoadAlerts.Arn

  VarunaRoadAlertSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(30 minutes)
      State: !Ref RoadAlertScheduleState
      Targets:
        - Arn: !GetAtt VarunaRoadAlertIngest.Arn
          Id: VarunaRoadAlertIngest
          RetryPolicy:
            MaximumRetryAttempts: 0

  VarunaRoadAlertScheduleInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VarunaRoadAlertIngest
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VarunaRoadAlertSchedule.Arn

Outputs:
  ApiBaseUrl:
    Description: API base URL; responses explicitly identify synthetic Scenario mode
    Value: !Sub https://${VarunaHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  PrivatePhotoBucket:
    Description: Private report-photo bucket; do not make public
    Value: !Ref VarunaPrivatePhotos
  ReportsTable:
    Description: Durable report metadata table
    Value: !Ref VarunaReports
  RealRoadReportsTable:
    Description: Separate limited-coverage real-road metadata and upload-quota table
    Value: !Ref VarunaRealRoadReports
  RoadAlertsTable:
    Description: Retained, encrypted official-source alert revisions and source health
    Value: !Ref VarunaRoadAlerts
  RoadAlertIngestFunction:
    Description: Isolated scheduled/manual ingestion Lambda name
    Value: !Ref VarunaRoadAlertIngest
